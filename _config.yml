# Site configuration — Minimal Mistakes 4.28.x on Jekyll 4.4, built by GitHub Actions
# (.github/workflows/pages.yml). This file is NOT reloaded by `jekyll serve`;
# restart the server after editing it.
#
# Theme docs: https://mmistakes.github.io/minimal-mistakes/docs/configuration/

# Theme Settings
theme                    : "minimal-mistakes-jekyll" # version pinned in Gemfile / Gemfile.lock
ignore_theme_config      : true # don't merge the theme repo's demo _config.yml (sample links, paginate, etc.)
minimal_mistakes_skin    : "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "catppuccin_latte", "catppuccin_mocha"

# Site Settings
locale                   : "en-US"
title                    : "James S. Santangelo, PhD"
title_separator          : "|"
subtitle                 : # site tagline that appears below site title in masthead
name                     : "James S. Santangelo, PhD"
description              : "Assistant Professor"
url                      : "https://james-s-santangelo.github.io"
baseurl                  : # leave blank for a user/org site
repository               : "James-S-Santangelo/James-S-Santangelo.github.io"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : "James S. Santangelo, PhD" # overrides the website title displayed in the masthead
breadcrumbs              : false
words_per_minute         : 200
enable_copy_code_button  : false
copyright                : "James S. Santangelo" # footer copyright name, defaults to site.title
copyright_url            : # defaults to site.url
timezone                 : "America/Toronto"

comments:
  provider               : false
atom_feed:
  hide                   : true # no posts yet; set to false (and add posts) to expose /feed.xml
search                   : false

# SEO Related
google_site_verification : "mD2iEV_2oE05RuRCnYelTq7w25S4B_DDz7ajGM0StNo"
bing_site_verification   :

# Social Sharing
og_image                 : # Open Graph/Twitter default site image
social:
  type                   : Person
  name                   :
  links:
    - "https://scholar.google.com/citations?user=3Y4O9c4AAAAJ"
    - "https://github.com/James-S-Santangelo"
    - "https://orcid.org/0000-0002-5921-2548"

# Analytics — removed. The old Universal Analytics property (UA-163993944-1)
# stopped collecting data on 2023-07-01. Supported providers if needed later:
# "google-gtag" (GA4 "G-" ID), "swetrix", "custom".
analytics:
  provider               : false

# Site Author (sidebar profile)
author:
  name             : "James S. Santangelo, PhD"
  avatar           : "/assets/images/UTM_James_Santangelo_headshot.jpeg"
  bio              : "Assistant Professor, Department of Biology at the University of Ottawa"
  location         : "Ottawa, Canada"
  email            : "jsantang@uottawa.ca"
  links:
    - label: "Google Scholar"
      icon: "fa-brands fa-fw fa-google-scholar"
      url: "https://scholar.google.com/citations?user=3Y4O9c4AAAAJ&hl=en"
    - label: "GitHub"
      icon: "fa-brands fa-fw fa-github"
      url: "https://github.com/James-S-Santangelo"
    - label: "ORCID"
      icon: "fa-brands fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-5921-2548"
    - label: "CV (PDF)"
      icon: "fa-solid fa-fw fa-file-pdf"
      url: "/assets/docs/Santangelo_cv.pdf"

# Site Footer
footer:
  links:
    - label: "Google Scholar"
      icon: "fa-brands fa-fw fa-google-scholar"
      url: "https://scholar.google.com/citations?user=3Y4O9c4AAAAJ&hl=en"
    - label: "GitHub"
      icon: "fa-brands fa-fw fa-github"
      url: "https://github.com/James-S-Santangelo"
  since: "2020" # renders "© 2020 - <current year>"

# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - tmp
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Sass/SCSS (Dart Sass via jekyll-sass-converter 3.x)
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true # silence deprecation noise from the theme's own partials
  silence_deprecations: ["import", "global-builtin"]

# Outputting
permalink: /:categories/:title/

# Plugins (all are runtime dependencies of the theme gem)
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed

# Archives (Liquid-based; no archive pages exist yet)
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
