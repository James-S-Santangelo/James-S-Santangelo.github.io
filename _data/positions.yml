# Open positions on the Join page (rendered by _includes/positions.html on /join/).
#
# Each position:
#   title:        Short project title (required)
#   open:         true to show it; false to hide it without deleting it
#   level:        Who it's for, e.g. "MSc or PhD", "PhD", "Undergraduate (BIO4009)"
#   start:        e.g. "September 2027"
#   funding:      e.g. "Fully funded via NSERC Discovery Grant"
#   description:  A paragraph or two. Markdown allowed (use the `|` block form below).
#
# When no position has `open: true`, the page shows a short "no listed openings,
# but get in touch" message instead.

positions:
  # TODO: replace this example with real projects, then set open: true
  - title: "Example project title"
    open: false
    level: "MSc or PhD"
    start: "September 2027"
    funding: "Funded"
    description: |
      What the project asks, the system and approaches involved (field, wet lab,
      sequencing, computational), and what background would suit it.
