# People page data (rendered by _includes/people.html on /people/).
#
# Each member:
#   name:     Full name (required)
#   group:    One of the `key`s under `groups` below (required); decides the section
#   stage:    Career stage / position shown under the name, e.g. "PhD student (2026–)"
#   photo:    Path to a photo; square-ish, ~800 px, < 200 KB is plenty.
#             Put photos in /assets/images/people/. Leave blank for a placeholder icon.
#   project:  1–3 sentences on their project. Markdown allowed (links, *italics*).
#   email:    Shown as an envelope icon (mailto link)
#   cv:       Link to a CV: a PDF in /assets/docs/people/ or an external URL
#   links:    Optional extra icon links, e.g. a personal website or ORCID:
#               - label: "ORCID"
#                 icon: "fa-brands fa-orcid"
#                 url: "https://orcid.org/0000-0000-0000-0000"
#
# Blank or missing fields are simply not shown. Order in this file = order on the page.

# Sections, in display order. Empty sections are hidden automatically.
groups:
  - key: pi
    title: Principal Investigator
  - key: postdoc
    title: Postdoctoral Fellows
  - key: grad
    title: Graduate Students
  - key: staff
    title: Research Staff
  - key: undergrad
    title: Undergraduate Students

